spring.application.name=backend

# Import secret datasource properties
# spring.datasource.url
# spring.datasource.username
# spring.datasource.password
spring.config.import=optional:classpath:application.secret[.properties]

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload and Static Resource Configuration
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS & Cognito Configuration
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${COGNITO_CLIENT_ID:}
aws.cognito.region=${AWS_REGION:eu-central-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
